name: Notes Application CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Build, Lint, Test & Package
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./src/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Static Code Analysis (Lint)
        run: npm run test:lint

      - name: Run Unit Tests & Coverage
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          SERVER: mongodb://127.0.0.1:27017

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run End-to-End Tests
        run: npm run test:e2e
        env:
          SERVER: mongodb://127.0.0.1:27017

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/playwright-report/

      - name: Package Deployable Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: tar --exclude='node_modules' -czf ../deployable-artifact.tar.gz .

      - name: Upload Artifact (Main Branch ONLY)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deployable-build-artifact
          path: deployable-artifact.tar.gz
